<div class="mx-0 my-0 px-2">

  <div class="mt-3">
    <h2 class="header">Aluguéis de Temporadas</h2>
    <p class="sub-header" style="color:#222121b8; ">em Santa Catarina</p>
  </div>

  <div *ngIf="spinnerOn" class="card flex justify-content-center">
    <p-progressSpinner></p-progressSpinner>
  </div>
        <!-- src="../../../assets/images/background-home" -->

  
  <div *ngIf="!spinnerOn" class="grid grid-nogutter flex flex-direction-row">
    
    <div class="col-12 md:col-6 lg:col-3" *ngFor="let accomodation of accommodations">
      <div class="m-2">
        <p-galleria *ngIf="accomodation.files?.length" [value]="accomodation.files" [showItemNavigators]="true"
        [responsiveOptions]="responsiveOptions" [showThumbnails]="false" [showIndicators]="true"
        [showIndicatorsOnItem]="true" [circular]="true"
        [containerStyle]="{ 'max-width': '640px', 'margin-top':'1rem' }">
        <ng-template pTemplate="item" let-item>
          <img [src]="item?.url"
          style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 5px"
          alt="principal" />
        </ng-template>
      </p-galleria>
      <div *ngIf="!accomodation.files?.length">
        <img src="../../../assets/images/no_image.png" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 5px">
      </div>
    </div>
    
    <div style="cursor: pointer;" (click)="sendDetails(accomodation)">
      <div class=" m-2">
        <div
            style="width: auto; height: 4.2rem;  display: flex; flex-direction: column; justify-content: flex-start;">
            <h3 class="title"> {{ accomodation.typeSelected}} em
              {{accomodation.city}}</h3>
              <!-- <p style="color:#222121b8">{{accomodation.guestsAllowed}} Hóspedes - {{accomodation.rooms}} quartos -
                {{accomodation.toilets}} banheiros
              </p> -->
              <p style="color:#222121b8"><b> {{accomodation.dailyRate| currency:'BRL' }} </b>diária</p>
            </div>
          </div>
        </div>
      </div>
      
    </div>
  </div>
  <div *ngIf="accommodations.length < 1" class="flex justify-content-center">
    <p class="text-2xl	">Não existem resultados para essa busca!</p>
  </div>
